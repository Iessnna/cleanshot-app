<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleanshot — Polish your screenshots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="2" width="20" height="20" rx="6" fill="#5B6CFF"/>
        <path d="M7 12L10.5 15.5L17 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Cleanshot</span>
    </div>
    <div class="topbar-actions">
      <button id="newBtn" class="btn btn-ghost" title="Start over with a new image">New image</button>
      <button id="copyBtn" class="btn btn-ghost" disabled>Copy</button>
      <button id="exportBtn" class="btn btn-primary" disabled>Download PNG</button>
    </div>
  </header>

  <div class="workspace">

    <!-- Left tool rail -->
    <nav class="toolrail" aria-label="Tools">
      <button class="tool-btn active" data-tool="select" title="Move / select">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 3L19 12L12 13.5L9 20L5 3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>Select</span>
      </button>
      <button class="tool-btn" data-tool="blur" title="Blur — hide sensitive info">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 3"/></svg>
        <span>Blur</span>
      </button>
      <button class="tool-btn" data-tool="box" title="Rectangle">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="4" y="6" width="16" height="12" rx="2" stroke="currentColor" stroke-width="1.8"/></svg>
        <span>Box</span>
      </button>
      <button class="tool-btn" data-tool="arrow" title="Arrow">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 20L20 4M20 4H11M20 4V13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Arrow</span>
      </button>
      <button class="tool-btn" data-tool="text" title="Text">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 5H19M12 5V19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <span>Text</span>
      </button>
      <div class="rail-divider"></div>
      <button class="tool-btn" id="undoBtn" title="Undo last shape">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 7L4 12L9 17M4 12H14C17.3 12 20 14.7 20 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Undo</span>
      </button>
      <button class="tool-btn" id="clearBtn" title="Clear all annotations">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 6H19M9 6V4H15V6M7 6L8 19H16L17 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>Clear</span>
      </button>
    </nav>

    <!-- Center canvas area -->
    <main class="canvas-area">
      <div id="dropZone" class="drop-zone">
        <div class="drop-content">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none"><path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="#5B6CFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16V18C4 19.1 4.9 20 6 20H18C19.1 20 20 19.1 20 18V16" stroke="#5B6CFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h2>Drop a screenshot here</h2>
          <p>or click to browse — or just paste with <kbd>Ctrl</kbd>+<kbd>V</kbd></p>
          <input type="file" id="fileInput" accept="image/*" hidden>
        </div>
      </div>

      <div id="canvasWrap" class="canvas-wrap hidden">
        <canvas id="mainCanvas"></canvas>
      </div>
    </main>

    <!-- Right panel -->
    <aside class="panel" id="rightPanel">
      <section class="panel-section">
        <h3>Background</h3>
        <div class="swatch-row" id="bgSwatches">
          <button class="swatch" data-bg="none" title="None"><span class="swatch-none">×</span></button>
          <button class="swatch active" data-bg="indigo" style="--c1:#5B6CFF;--c2:#8C7BFF" title="Indigo"></button>
          <button class="swatch" data-bg="teal" style="--c1:#2EC4B6;--c2:#5EE0D3" title="Teal"></button>
          <button class="swatch" data-bg="sunset" style="--c1:#FF6B5E;--c2:#FFB36B" title="Sunset"></button>
          <button class="swatch" data-bg="slate" style="--c1:#3A3F4B;--c2:#6B7280" title="Slate"></button>
          <button class="swatch" data-bg="mint" style="--c1:#A8E6CF;--c2:#DCEDC8" title="Mint"></button>
        </div>
      </section>

      <section class="panel-section">
        <h3>Padding</h3>
        <input type="range" id="paddingSlider" min="0" max="120" value="48" class="slider">
      </section>

      <section class="panel-section">
        <h3>Corner radius</h3>
        <input type="range" id="radiusSlider" min="0" max="40" value="14" class="slider">
      </section>

      <section class="panel-section">
        <h3>Shadow</h3>
        <input type="range" id="shadowSlider" min="0" max="100" value="55" class="slider">
      </section>

      <section class="panel-section">
        <h3>Annotation color</h3>
        <div class="swatch-row" id="colorSwatches">
          <button class="color-swatch active" data-color="#5B6CFF" style="background:#5B6CFF"></button>
          <button class="color-swatch" data-color="#FF6B5E" style="background:#FF6B5E"></button>
          <button class="color-swatch" data-color="#2EC4B6" style="background:#2EC4B6"></button>
          <button class="color-swatch" data-color="#1A1D24" style="background:#1A1D24"></button>
          <button class="color-swatch" data-color="#FFFFFF" style="background:#FFFFFF;border:1px solid #E8EAED"></button>
        </div>
      </section>

      <p class="panel-hint" id="panelHint">Tip: pick the blur tool, then drag over anything you want to hide.</p>
    </aside>

  </div>
</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
